[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-qc"
version = "0.1.1"
description = "Fail-closed quality gate for quantitative backtests: DSR, PBO, Harvey-Liu haircut, and MinTRL in one NumPy engine with P0/P1/P2 severity grading."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.24"]
keywords = ["backtest", "overfitting", "deflated-sharpe", "pbo", "mintrl", "factor", "qc", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
qc = "factor_qc.cli:main"
factor-qc = "factor_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

